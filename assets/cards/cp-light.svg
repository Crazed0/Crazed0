<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="BestCode Control Panel: Painel de alojamento próprio: deploy de sites Node e Next.js, bases de dados, email e webmail com login único, firewall e gestão de utilizadores.">
<defs>
  <radialGradient id="g" cx="100%" cy="0%" r="75%">
    <stop offset="0" stop-color="#4c9bff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4c9bff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="c"><rect width="440" height="236" rx="16"/></clipPath>
</defs>
<style>
  .pulse{transform-origin:center;transform-box:fill-box;animation:p 2.2s ease-out infinite}
  @keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
  .sh{animation:sh 7s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.75}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="440" height="236" fill="#f6f8fc"/>
  <rect class="sh" width="440" height="236" fill="url(#g)"/>
  <rect x="0" y="0" width="440" height="3" fill="#4c9bff" opacity=".9"/>
</g>
<rect x=".5" y=".5" width="439" height="235" rx="16" fill="none" stroke="#dce3ee"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <text x="24" y="40" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4c9bff" font-weight="700">INFRAESTRUTURA · HOSTING</text>
  <text x="24" y="74" font-size="23" font-weight="800" fill="#0c1a2e" letter-spacing="-.4">BestCode Control Panel</text>
  <text x="24" y="108" font-size="14" fill="#53637c">Painel de alojamento próprio: deploy de sites Node e</text><text x="24" y="129" font-size="14" fill="#53637c">Next.js, bases de dados, email e webmail com login</text><text x="24" y="150" font-size="14" fill="#53637c">único, firewall e gestão de utilizadores.</text>
  <rect x="24" y="190" width="49" height="24" rx="12" fill="#e9eef6"/><text x="48.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#34445d">Node</text><rect x="81" y="190" width="57" height="24" rx="12" fill="#e9eef6"/><text x="109.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#34445d">Linux</text><rect x="146" y="190" width="57" height="24" rx="12" fill="#e9eef6"/><text x="174.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#34445d">Nginx</text><rect x="211" y="190" width="71" height="24" rx="12" fill="#e9eef6"/><text x="246.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#34445d">MariaDB</text>
  <g>
    <circle cx="414" cy="36" r="4" fill="#2fbf71"/><circle class="pulse" cx="414" cy="36" r="4" fill="#2fbf71"/>
    <text x="402" y="40" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" fill="#8a97ab">web.bestcode.pt ↗</text>
  </g>
</g>
</svg>