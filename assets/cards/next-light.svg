<svg xmlns="http://www.w3.org/2000/svg" width="472" height="260" viewBox="-16 0 472 260" role="img" aria-label="O teu projeto: Site, loja online ou sistema de gestão à medida, do design ao servidor. Fala comigo em bestcode.pt.">
<defs>
  <radialGradient id="g" cx="100%" cy="0%" r="75%">
    <stop offset="0" stop-color="#2fbf71" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#2fbf71" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="c"><rect width="440" height="236" rx="16"/></clipPath>
</defs>
<style>
  .pulse{transform-origin:center;transform-box:fill-box;animation:p 2.2s ease-out infinite}
  @keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
  .sh{animation:sh 7s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.75}50%{opacity:1}}
  .mini{display:none}
  @media (max-width:390px){.full{display:none}.mini{display:inline}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="440" height="236" fill="#f6f8fc"/>
  <rect class="sh" width="440" height="236" fill="url(#g)"/>
  <rect x="0" y="0" width="440" height="3" fill="#2fbf71" opacity=".9"/>
</g>
<rect x=".5" y=".5" width="439" height="235" rx="16" fill="none" stroke="#dce3ee"/>
<g class="full" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <text x="24" y="40" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#2fbf71" font-weight="700">DISPONÍVEL</text>
  <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fbf71"/><stop offset="1" stop-color="#2fbf71" stop-opacity=".55"/></linearGradient></defs>
  <rect x="24" y="52" width="48" height="48" rx="12" fill="url(#mg)"/>
  <text x="48" y="86" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="28.0" font-weight="800" fill="#0a101d">+</text>
  <text x="86" y="84" font-size="22" font-weight="800" fill="#0c1a2e" letter-spacing="-.4">O teu projeto</text>
  <text x="24" y="126" font-size="14" fill="#53637c">Site, loja online ou sistema de gestão à medida, do</text><text x="24" y="146" font-size="14" fill="#53637c">design ao servidor. Fala comigo em bestcode.pt.</text>
  
  <g>
    <circle cx="414" cy="36" r="4" fill="#2fbf71"/><circle class="pulse" cx="414" cy="36" r="4" fill="#2fbf71"/>
    <text x="402" y="40" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" fill="#8a97ab">bestcode.pt ↗</text>
  </g>
</g>
<g class="mini" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fbf71"/><stop offset="1" stop-color="#2fbf71" stop-opacity=".55"/></linearGradient></defs>
  <rect x="24" y="30" width="84" height="84" rx="12" fill="url(#mg)"/>
  <text x="66" y="89.5" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="49.0" font-weight="800" fill="#0a101d">+</text>
  <text x="128" y="84" font-size="36" font-weight="800" fill="#0c1a2e" letter-spacing="-.8">O teu projeto</text>
  
  <circle cx="408" cy="178" r="9" fill="#2fbf71"/><circle class="pulse" cx="408" cy="178" r="9" fill="#2fbf71"/>
</g>
</svg>