<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="PROJECT Gym: App de ginásio que funciona offline, ligada a um bot de Discord: treinos, recordes, feed social, calorias e música. XP, ranks, desafios e duelos.">
<defs>
  <radialGradient id="g" cx="100%" cy="0%" r="75%">
    <stop offset="0" stop-color="#ff5470" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#ff5470" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="c"><rect width="440" height="236" rx="16"/></clipPath>
</defs>
<style>
  .pulse{transform-origin:center;transform-box:fill-box;animation:p 2.2s ease-out infinite}
