  .sh{animation:sh 7s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.75}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="440" height="236" fill="#0e1626"/>
  <rect class="sh" width="440" height="236" fill="url(#g)"/>
  <rect x="0" y="0" width="440" height="3" fill="#ff5470" opacity=".9"/>
</g>
<rect x=".5" y=".5" width="439" height="235" rx="16" fill="none" stroke="#1c2840"/>
