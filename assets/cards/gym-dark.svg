  <rect x="24" y="190" width="57" height="24" rx="12" fill="#152137"/><text x="52.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#b9c6dc">React</text><rect x="89" y="190" width="49" height="24" rx="12" fill="#152137"/><text x="113.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#b9c6dc">Node</text><rect x="146" y="190" width="93" height="24" rx="12" fill="#152137"/><text x="192.5" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#b9c6dc">Discord.js</text><rect x="247" y="190" width="42" height="24" rx="12" fill="#152137"/><text x="268" y="206" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#b9c6dc">PWA</text>
