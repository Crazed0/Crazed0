<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Casa das Madeiras Riza: Catálogo com stock de cada loja em tempo real ligado à faturação, orçamentos online, configurador 3D e área de gestão com relatórios e notificações push.">
<defs>
